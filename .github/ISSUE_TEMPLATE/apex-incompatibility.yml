name: Oracle APEX incompatibility
description: Report a version-specific APEX or database compatibility problem.
title: "[APEX compatibility]: "
labels: [compatibility]
body:
  - type: input
    id: apex
    attributes:
      label: Oracle APEX version
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Oracle Database version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and reproduction
      description: Do not include workspace, application, schema, user, URL, token, or production data.
    validations:
      required: true
