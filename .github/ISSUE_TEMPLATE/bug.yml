name: Bug report
description: Report a reproducible defect in the runtime, plug-in, package, skill, or tooling.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Runtime, APEX plug-in, PL/SQL package, Skill, Profile, Tooling, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and remove credentials, private URLs, IDs, and production details.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Oracle APEX ECharts 1.0.0, APEX 24.2, database 26ai, browser version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
