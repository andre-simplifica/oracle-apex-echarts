name: Feature request
description: Propose a compatible, neutral capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the Oracle APEX use case and why the core remains project-neutral.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
    validations:
      required: true
