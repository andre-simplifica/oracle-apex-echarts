name: Check Apache ECharts upstream

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check canonical upstreams without changing files
        id: upstream
        run: npm run upstream:check

      - name: Open or update one upstream issue
        if: steps.upstream.outputs.update_available == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_TITLE: ${{ steps.upstream.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.upstream.outputs.issue_body }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "upstream-echarts";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "7C3AED", description: "Apache ECharts upstream release" });
            }
            const response = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label, per_page: 100 });
            const issue = response.data.find((item) => !item.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, title: process.env.ISSUE_TITLE, body: process.env.ISSUE_BODY });
            } else {
              await github.rest.issues.create({ owner, repo, title: process.env.ISSUE_TITLE, body: process.env.ISSUE_BODY, labels: [label] });
            }
