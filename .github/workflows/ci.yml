name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source and build deterministic artifacts
        run: npm run validate:all

      - name: Detect stale generated skill assets
        run: git diff --exit-code -- skills/oracle-apex-echarts/assets dist

      - name: Upload validated release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-apex-echarts-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
